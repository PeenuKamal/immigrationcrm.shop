# Optional: runs the site and its database together.  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: immigrationcrm
      POSTGRES_USER: immigrationcrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
  web:
    build: .
    restart: unless-stopped
    depends_on: [db]
    env_file: .env
    environment:
      DATABASE_URL: postgres://immigrationcrm:${POSTGRES_PASSWORD}@db:5432/immigrationcrm
    ports: ["127.0.0.1:3000:3000"]
volumes:
  pgdata:
